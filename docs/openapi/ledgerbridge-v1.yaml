openapi: 3.1.0
info:
  title: LedgerBridge Canonical Quote-to-Cash API
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
paths:
  /billing-requests:
    post:
      operationId: submitBillingRequestV1
      parameters:
        - name: X-Correlation-ID
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingRequestV1" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/BillingResponseV1" } } } }
        "200": { description: Replayed, content: { application/json: { schema: { $ref: "#/components/schemas/BillingResponseV1" } } } }
        "400": { description: Validation Error, content: { application/json: { schema: { $ref: "#/components/schemas/CanonicalErrorV1" } } } }
        "409": { description: Idempotency Conflict, content: { application/json: { schema: { $ref: "#/components/schemas/CanonicalErrorV1" } } } }
components:
  schemas:
    ExternalIdentityV1:
      type: object
      required: [provider, business, entityType, sourceId]
      properties:
        provider: { type: string, pattern: "^[^:]+$" }
        business: { type: string, pattern: "^[^:]+$" }
        entityType: { type: string, pattern: "^[^:]+$" }
        sourceId: { type: string, pattern: "^[^:]+$" }
    BillingLineItemV1:
      type: object
      required: [lineNumber, sku, quantity, unitPrice]
      properties:
        lineNumber: { type: integer, minimum: 1 }
        sku: { type: string, minLength: 1 }
        quantity: { type: number, exclusiveMinimum: 0 }
        unitPrice: { type: number, minimum: 0 }
    BillingRequestV1:
      type: object
      required: [identity, revision, currency, lines]
      properties:
        identity: { $ref: "#/components/schemas/ExternalIdentityV1" }
        revision: { type: integer, minimum: 1 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        lines: { type: array, minItems: 1, items: { $ref: "#/components/schemas/BillingLineItemV1" } }
    BillingResponseV1:
      type: object
      required: [correlationId, canonicalExternalId, idempotencyKey, revision, state, payloadHash]
      properties:
        correlationId: { type: string }
        canonicalExternalId: { type: string }
        idempotencyKey: { type: string }
        revision: { type: integer }
        state: { type: string, enum: [RECEIVED, VALIDATED, DISPATCHING, POSTED, RETRY_PENDING, REJECTED, SUPERSEDED, DEAD_LETTERED] }
        payloadHash: { type: string }
    CanonicalErrorV1:
      type: object
      required: [correlationId, errorCode, message, timestamp]
      properties:
        correlationId: { type: string }
        errorCode: { type: string, enum: [LB_VALIDATION_MISSING_CURRENCY, LB_VALIDATION_INVALID_QUANTITY, LB_VALIDATION_INVALID_IDENTITY, LB_IDEMPOTENCY_CONFLICT, LB_STATE_TRANSITION_INVALID, LB_UPSTREAM_SAP_ERROR] }
        message: { type: string }
        field: { type: string }
        timestamp: { type: string, format: date-time }
