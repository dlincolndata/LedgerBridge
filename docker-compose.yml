services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgerbridge-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledgerbridge}
      POSTGRES_USER: ${POSTGRES_USER:-ledgerbridge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledgerbridge_user} -d ${POSTGRES_DB:-ledgerbridge}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledgerbridge-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ledgerbridge}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ledgerbridge_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_password}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  postgres_data: